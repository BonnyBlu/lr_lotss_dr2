---
defaults: &common_settings                                               # create common files
    radio_in: 'LoTSS_DR2_v110_masked.srl.fits'
    opt_in: 'dr2_combined.fits'
    gaussian_in: 'LoTSS_DR2_v110.gaus.fits'
    

hp_inputs:
    <<: *common_settings                                                 # add common files


lr_inputs:
    <<: *common_settings                                                 # add common files
    max_major: 15                                                        # maximum radius
    colour_limits_post: [0.7, 1.1, 1.5, 1.9, 2.3, 2.7, 3.1, 3.5, 4.1]    # boundaries of colour bins
    params_name: 'params_'                                               # params save file
    opt_hp_in: 'optical_nn_'                                             # optical input catalogue
    rad_hp_in: 'radio_'                                                  # radio input catalogue
    gauss_in: 'gaussian_'                                                # gaussian input catalogue
    rad_hp_out: 'radio_lr_'                                              # radio output catalogue
    gauss_out: 'gaussian_lr'                                             # gaussian output catalogue
    rad_nn_in: 'radio_nn_'                                               # radio nearest neighbours input catalogue
    gauss_nn_in: 'gaussian_nn_'                                          # gaussian nearest neighbours input catalogue
    rad_nn_out: 'radio_nn_lr_'                                           # radio nearest neighbours output catalogue
    gauss_nn_out: 'gaussian_nn_lr_'                                      # gaussian nearest neighbours output catalogue

gbc_inputs:
    <<: *common_settings                                                 # add common files



rlxid_inputs:
    <<: *common_settings                                                 # add common files
    



















